services:
  - type: web
    name: permguard-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-local.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
